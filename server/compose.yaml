name: katago

services:
  katago:
    image: ${KATAGO_IMAGE:-registry.gitlab.com/igrek51/registry/katago:latest}
    container_name: katago
    restart: unless-stopped
    ports:
      - "127.0.0.1:2718:2718"
    environment:
      MOVE_VISITS: "8"
      SCORE_VISITS: "150"
    stdin_open: true
    tty: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,urllib.request;urllib.request.urlopen('http://localhost:2718/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
