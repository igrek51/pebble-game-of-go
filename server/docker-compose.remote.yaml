# Remote (production) compose for katago.igrek.dev: runs the prebuilt
# registry image, no build context needed. Port is bound to localhost
# only — TLS/edge is handled in front (Cloudflare Tunnel or host nginx).
# Override image: KATAGO_IMAGE=registry.gitlab.com/igrek51/katago:1.1 docker compose up -d
services:
  katago:
    container_name: katago
    image: ${KATAGO_IMAGE:-registry.gitlab.com/igrek51/katago:1.0}
    ports:
      - "0.0.0.0:2718:2718"
    environment:
      MOVE_VISITS: "8"
      SCORE_VISITS: "150"
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,urllib.request;urllib.request.urlopen('http://localhost:2718/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
